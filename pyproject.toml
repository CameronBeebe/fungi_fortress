[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fungi_fortress"
version = "0.1.0"
description = "A terminal-based strategy/simulation game with LLM-powered content generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fungi Fortress Contributors"}
]
keywords = ["game", "roguelike", "terminal", "curses", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "windows-curses; sys_platform == 'win32'",
    "noise>=1.2.0",
    "groq>=0.4.0",
    "openai>=1.0.0",
    "requests>=2.25.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "python-dotenv>=0.19.0",
]

[project.scripts]
fungi = "fungi_fortress.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fungi_fortress*"]

[tool.setuptools.package-data]
fungi_fortress = ["seeds/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
